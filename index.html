<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prism</title>
<meta name="description" content="Drop blocks, clear lines, keep the board alive.">
<meta name="theme-color" content="#060A15">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prism">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<style>
/* ============================================================
   PRISM — design tokens
   ink board, jewel-glass blocks, one accent for actions
   ============================================================ */
:root{
  --ink:        #060A15;
  --ink-2:      #0B1222;
  --panel:      #101A2F;
  --cell:       #16203A;
  --line:       rgba(255,255,255,.07);
  --text:       #E9EEFB;
  --muted:      #6E7C9E;
  --accent:     #6C7BFF;
  --accent-2:   #A06BFF;
  --good:       #5DD39E;

  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);

  --r-lg: 26px;
  --r-md: 18px;
  --r-sm: 12px;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display",
          "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0;
  height:100%; width:100%;
  overflow:hidden;
  position:fixed;
  overscroll-behavior:none;
  touch-action:none;
  background:var(--ink);
  color:var(--text);
  font-family:var(--font);
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}

#stage{ position:fixed; inset:0; display:block; touch-action:none; }

#safeProbe{
  position:fixed; top:0; left:0; width:1px; height:1px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  visibility:hidden; pointer-events:none;
}

/* ---------- heads-up display ---------- */
#hud{ position:fixed; inset:0; pointer-events:none; }

#topbar{
  position:absolute; left:0; right:0;
  top:calc(var(--sat) + 10px);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px;
  height:36px;
}
.chip{
  font-size:13px; font-weight:600; letter-spacing:.1px;
  color:var(--muted);
  display:flex; align-items:center; gap:7px;
}
.chip b{ color:#9FB0D8; font-weight:700; }

.iconbtn{
  pointer-events:auto;
  width:36px; height:36px; border:0; padding:0; margin:0;
  border-radius:50%;
  background:rgba(255,255,255,.055);
  color:#93A2C6;
  display:grid; place-items:center;
  transition:transform .12s ease, background .18s ease;
}
.iconbtn:active{ transform:scale(.9); background:rgba(255,255,255,.1); }
.iconbtn svg{ width:19px; height:19px; }

#scoreBlock{
  position:absolute; left:0; right:0;
  top:calc(var(--sat) + 46px);
  text-align:center;
}
#score{
  font-size:52px; line-height:1;
  font-weight:800; letter-spacing:-2.4px;
  text-shadow:0 0 34px rgba(108,123,255,.35);
  transform-origin:50% 50%;
  will-change:transform;
}
#chase{
  margin-top:8px; height:16px;
  font-size:12.5px; font-weight:600; color:var(--muted);
  opacity:0; transition:opacity .3s ease;
}
#chase.on{ opacity:1; }

#combo{
  position:absolute;
  right:22px;
  top:var(--comboTop,200px);
  padding:7px 13px 7px 11px;
  border-radius:999px;
  font-size:15px; font-weight:800; letter-spacing:-.3px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  box-shadow:0 6px 22px rgba(108,123,255,.45);
  opacity:0; transform:scale(.6) translateY(6px);
  transition:opacity .18s ease, transform .18s cubic-bezier(.2,1.5,.4,1);
}
#combo.on{ opacity:1; transform:scale(1) translateY(0); }

/* ---------- overlay screens ---------- */
.screen{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:calc(var(--sat) + 28px) 26px calc(var(--sab) + 28px);
  background:radial-gradient(120% 80% at 50% 10%, rgba(20,30,58,.82), rgba(4,7,14,.94) 70%);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  opacity:0; pointer-events:none;
  transition:opacity .26s ease;
  z-index:10;
}
.screen.on{ opacity:1; pointer-events:auto; }
.screen > *{ transform:translateY(14px); transition:transform .34s cubic-bezier(.2,.9,.3,1); }
.screen.on > *{ transform:none; }

/* logo */
.logo{
  display:flex; align-items:center; gap:12px;
  margin-bottom:6px;
}
.logo .mark{ width:38px; height:38px; }
.logo .word{
  font-size:34px; font-weight:800; letter-spacing:5px;
  padding-left:3px;
}
.tagline{ color:var(--muted); font-size:14px; margin:10px 0 34px; text-align:center; }

/* input */
.field{
  width:100%; max-width:320px;
  position:relative;
}
.field input{
  width:100%;
  font-family:var(--font);
  font-size:19px; font-weight:600; color:var(--text);
  background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.09);
  border-radius:var(--r-md);
  padding:16px 18px;
  outline:none;
  text-align:center;
  transition:border-color .2s ease, background .2s ease;
}
.field input::placeholder{ color:#57648A; font-weight:500; }
.field input:focus{ border-color:rgba(108,123,255,.75); background:rgba(108,123,255,.07); }

/* buttons */
.btn{
  -webkit-appearance:none; appearance:none;
  border:0; font-family:var(--font);
  width:100%; max-width:320px;
  padding:18px 24px;
  border-radius:var(--r-md);
  font-size:18px; font-weight:800; letter-spacing:.2px;
  color:#fff;
  background:linear-gradient(135deg,#6C7BFF,#9A6BFF);
  box-shadow:0 10px 30px rgba(108,123,255,.38), inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .11s ease, box-shadow .2s ease, opacity .2s ease;
}
.btn:active{ transform:scale(.965); box-shadow:0 5px 16px rgba(108,123,255,.3), inset 0 1px 0 rgba(255,255,255,.28); }
.btn[disabled]{ opacity:.4; }
.btn.quiet{
  background:rgba(255,255,255,.06);
  color:#A9B6D8; font-weight:700; font-size:16px;
  box-shadow:none; padding:14px 24px;
}
.btn.quiet:active{ background:rgba(255,255,255,.1); }
.linkbtn{
  background:none; border:0; padding:12px 16px; margin-top:2px;
  font-family:var(--font); font-size:15px; font-weight:600;
  color:var(--muted);
  transition:color .15s ease;
}
.linkbtn:active{ color:var(--text); }

.stack{ width:100%; max-width:320px; display:flex; flex-direction:column; align-items:center; gap:12px; }

/* ---------- result screen ---------- */
#resultScreen{ justify-content:center; }
.result-eyebrow{ font-size:14px; font-weight:600; color:var(--muted); margin-bottom:2px; }
#finalScore{
  font-size:76px; font-weight:800; letter-spacing:-4px; line-height:1;
  margin:4px 0 6px;
}
#pbFlag{
  font-size:14px; font-weight:800; letter-spacing:.4px;
  color:#0A0F1C;
  background:linear-gradient(135deg,#FFD93D,#FFB347);
  padding:6px 13px; border-radius:999px;
  box-shadow:0 6px 20px rgba(255,200,70,.3);
  margin-bottom:4px;
  display:none;
}
#pbFlag.on{ display:block; }

#rankLine{
  display:flex; align-items:baseline; gap:9px;
  margin:14px 0 26px;
  font-size:19px; font-weight:700; color:#B9C6E8;
}
#rankOld{ color:#54618A; font-size:16px; font-weight:600; text-decoration:line-through; text-decoration-color:#39425e; }
#rankArrow{ color:var(--good); font-size:15px; }
#rankNew.pending{ color:var(--muted); font-size:15px; font-weight:600; }

.stats{
  display:flex; gap:8px; width:100%; max-width:320px; margin-bottom:26px;
}
.stat{
  flex:1; text-align:center;
  background:rgba(255,255,255,.045);
  border-radius:var(--r-sm);
  padding:12px 6px;
}
.stat .v{ font-size:17px; font-weight:800; letter-spacing:-.4px; }
.stat .k{ font-size:11.5px; font-weight:600; color:var(--muted); margin-top:3px; }

/* ---------- leaderboard ---------- */
#lbScreen{ justify-content:flex-start; padding-top:calc(var(--sat) + 22px); }
.sheet-head{
  width:100%; max-width:400px;
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:18px;
}
.sheet-head h2{ font-size:21px; font-weight:800; letter-spacing:-.4px; margin:0; }
#lbList{
  width:100%; max-width:400px;
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  mask-image:linear-gradient(180deg,#000 92%,transparent);
}
.row{
  display:flex; align-items:center; gap:12px;
  padding:11px 14px; border-radius:14px;
  font-size:15.5px;
}
.row + .row{ margin-top:2px; }
.row .rk{ min-width:46px; white-space:nowrap; color:var(--muted); font-weight:700; font-size:13.5px; }
.row .nm{ flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .sc{ font-weight:800; letter-spacing:-.3px; }
.row.top1 .rk{ color:#FFD93D; }
.row.top2 .rk{ color:#C8D3EC; }
.row.top3 .rk{ color:#E0A36B; }
.row.me{
  background:linear-gradient(135deg,rgba(108,123,255,.22),rgba(160,107,255,.16));
  box-shadow:inset 0 0 0 1.5px rgba(108,123,255,.42);
}
.row.me .rk{ color:#AFB9FF; }
#lbMe{ width:100%; max-width:400px; margin-top:10px; }
#lbFoot{ width:100%; max-width:400px; margin-top:14px; display:flex; justify-content:center; }

/* ---------- settings ---------- */
#setScreen .panel{
  width:100%; max-width:340px;
  background:rgba(255,255,255,.045);
  border-radius:var(--r-lg);
  padding:8px 6px;
}
.setrow{
  display:flex; align-items:center; justify-content:space-between;
  padding:15px 16px;
  font-size:16px; font-weight:600;
}
.setrow + .setrow{ border-top:1px solid var(--line); }
.toggle{
  width:50px; height:30px; border-radius:999px; border:0; padding:0;
  background:rgba(255,255,255,.12);
  position:relative; transition:background .2s ease;
}
.toggle::after{
  content:''; position:absolute; top:3px; left:3px;
  width:24px; height:24px; border-radius:50%;
  background:#8B99BC;
  transition:transform .2s cubic-bezier(.2,.9,.3,1), background .2s ease;
}
.toggle.on{ background:rgba(108,123,255,.55); }
.toggle.on::after{ transform:translateX(20px); background:#fff; }

/* loading splash */
#splash{
  position:fixed; inset:0; z-index:50;
  display:grid; place-items:center;
  background:var(--ink);
  transition:opacity .4s ease;
}
#splash.gone{ opacity:0; pointer-events:none; }

@media (prefers-reduced-motion: reduce){
  .screen, .screen > *, .btn, .iconbtn, #combo{ transition-duration:.01ms !important; }
}
</style>
</head>
<body>

<div id="safeProbe"></div>
<canvas id="stage"></canvas>

<div id="hud">
  <div id="topbar">
    <div class="chip" id="bestChip">Best <b>0</b></div>
    <button class="iconbtn" id="btnSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div id="scoreBlock">
    <div id="score">0</div>
    <div id="chase"></div>
  </div>

  <div id="combo"></div>
</div>

<!-- ===== first launch ===== -->
<section class="screen" id="nameScreen">
  <div class="logo">
    <svg class="mark" viewBox="0 0 40 40" fill="none">
      <rect x="3" y="3" width="15" height="15" rx="4.5" fill="#6C7BFF"/>
      <rect x="22" y="3" width="15" height="15" rx="4.5" fill="#5DD39E"/>
      <rect x="3" y="22" width="15" height="15" rx="4.5" fill="#FF7A6B"/>
      <rect x="22" y="22" width="15" height="15" rx="4.5" fill="rgba(255,255,255,.12)"/>
    </svg>
    <div class="word">PRISM</div>
  </div>
  <p class="tagline">Fit the blocks. Clear the lines.<br>See how long you last.</p>
  <div class="stack">
    <div class="field">
      <input id="nameInput" type="text" maxlength="14" placeholder="Your name" autocomplete="off"
             autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go">
    </div>
    <button class="btn" id="btnStart">Play</button>
  </div>
</section>

<!-- ===== game over ===== -->
<section class="screen" id="resultScreen">
  <div id="pbFlag">New personal best</div>
  <div class="result-eyebrow" id="resultEyebrow">No moves left</div>
  <div id="finalScore">0</div>
  <div id="rankLine">
    <span id="rankOld"></span>
    <span id="rankArrow"></span>
    <span id="rankNew">—</span>
  </div>
  <div class="stats">
    <div class="stat"><div class="v" id="stBest">0</div><div class="k">Best</div></div>
    <div class="stat"><div class="v" id="stPct">—</div><div class="k">Percentile</div></div>
    <div class="stat"><div class="v" id="stGames">0</div><div class="k">Games</div></div>
  </div>
  <div class="stack">
    <button class="btn" id="btnAgain">Play again</button>
    <button class="linkbtn" id="btnLbFromResult">Leaderboard</button>
  </div>
</section>

<!-- ===== leaderboard ===== -->
<section class="screen" id="lbScreen">
  <div class="sheet-head">
    <h2>Top players</h2>
    <button class="iconbtn" id="btnLbClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>
  <div id="lbList"></div>
  <div id="lbMe"></div>
  <div id="lbFoot"><button class="btn quiet" id="btnLbBack">Back to the board</button></div>
</section>

<!-- ===== settings ===== -->
<section class="screen" id="setScreen">
  <div class="stack" style="max-width:340px">
    <div class="panel">
      <div class="setrow"><span>Sound</span><button class="toggle on" id="tgSound" aria-label="Sound"></button></div>
      <div class="setrow"><span>Haptics</span><button class="toggle on" id="tgHaptics" aria-label="Haptics"></button></div>
      <div class="setrow">
        <span>Account</span>
        <span id="acctState" style="color:var(--muted);font-weight:600">Guest</span>
      </div>
      <div class="setrow" style="gap:12px">
        <span>Name</span>
        <input id="renameInput" type="text" maxlength="14" autocomplete="off" spellcheck="false"
          style="flex:1;min-width:0;text-align:right;background:none;border:0;outline:none;color:var(--text);font:inherit;font-weight:700">
      </div>
    </div>
    <button class="btn" id="btnSetClose" style="margin-top:6px">Done</button>
    <button class="linkbtn" id="btnRestart">Start a new game</button>
  </div>
</section>

<div id="splash">
  <svg width="44" height="44" viewBox="0 0 40 40" fill="none">
    <rect x="3" y="3" width="15" height="15" rx="4.5" fill="#6C7BFF"/>
    <rect x="22" y="3" width="15" height="15" rx="4.5" fill="#5DD39E"/>
    <rect x="3" y="22" width="15" height="15" rx="4.5" fill="#FF7A6B"/>
  </svg>
</div>

<script>
/* ============================================================
   PRISM
   A block puzzle built for one thumb.
   ------------------------------------------------------------
   01 · core: utils, storage, audio, haptics, pieces, bitboard
   ============================================================ */
'use strict';

/* ---------- small maths ---------- */
const clamp = (v,a,b)=> v<a?a:v>b?b:v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const easeOutCubic = t=> 1-Math.pow(1-t,3);
const easeOutQuint = t=> 1-Math.pow(1-t,5);
const easeInCubic  = t=> t*t*t;
const easeOutBack  = (t,s=1.9)=> 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);
const fmt = n=> Math.round(n).toLocaleString('en-US');
const nowMs = ()=> performance.now();

/* deterministic rng — lets the whole run be replayed from a seed */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

/* ---------- persistence ----------
   localStorage where allowed, memory everywhere else, same API either way.
   (Sandboxed previews block storage; the game still runs, it just forgets.) */
const Store = (()=>{
  let ok = false, mem = Object.create(null);
  try { const k='__prism_probe'; localStorage.setItem(k,'1'); localStorage.removeItem(k); ok = true; }
  catch(e){ ok = false; }
  return {
    persistent: ok,
    get(key, dflt){
      try {
        const raw = ok ? localStorage.getItem(key) : (key in mem ? mem[key] : null);
        return raw == null ? dflt : JSON.parse(raw);
      } catch(e){ return dflt; }
    },
    set(key, val){
      const raw = JSON.stringify(val);
      try { if(ok) localStorage.setItem(key, raw); else mem[key] = raw; }
      catch(e){ mem[key] = raw; }
    }
  };
})();

const K = {
  name:  'prism.v1.name',
  best:  'prism.v1.best',
  games: 'prism.v1.games',
  sound: 'prism.v1.sound',
  hapt:  'prism.v1.haptics',
  hist:  'prism.v1.history',
  queue: 'prism.v1.pendingRuns',
  session:'prism.v1.session',
  pid:   'prism.v1.playerId'
};

const settings = {
  sound:   Store.get(K.sound, true),
  haptics: Store.get(K.hapt,  true)
};

/* ---------- audio ----------
   Everything is synthesised. No files to download, works offline from the
   first tap, and pitch can ride the combo without re-recording anything. */
const Audio = (()=>{
  let ctx = null, bus = null, ready = false;

  function boot(){
    if(ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ctx = new AC();

    /* iOS routes Web Audio through the ringer channel and honours the hardware
       mute switch. Declaring the page as playback audio opts out of that.
       Safari 16.4+; harmless everywhere else. */
    try { if(navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = .003; comp.release.value = .18;
    bus = ctx.createGain(); bus.gain.value = .92;
    bus.connect(comp); comp.connect(ctx.destination);
    unlock();
    ready = true;
  }

  /* Older iOS keeps a context mute until it has played something from inside a
     genuine gesture. One silent sample is enough to open the gate. */
  function unlock(){
    if(!ctx) return;
    try {
      const src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, 22050);
      src.connect(ctx.destination);
      src.start(0);
    } catch(e){}
  }

  function resume(){
    boot();
    if(ctx && ctx.state !== 'running'){
      const r = ctx.resume();
      if(r && r.then) r.then(unlock, ()=>{});
      else unlock();
    }
  }

  /* Scheduling against a context that is still waking up is fine — the events
     fire when it resumes. Dropping them silently was losing the first sounds. */
  const live = ()=> settings.sound && ready && ctx && ctx.state !== 'closed';

  /* a single voice: osc -> lowpass -> env -> bus */
  function voice(o){
    if(!live()) return;
    const t0 = ctx.currentTime + (o.delay || 0);
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2), t0 + (o.dur||.2));

    const g = ctx.createGain();
    const peak = o.gain ?? .2, atk = o.atk ?? .006, dur = o.dur ?? .2;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);

    let node = osc;
    if(o.lp){
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.setValueAtTime(o.lp, t0);
      if(o.lp2) f.frequency.exponentialRampToValueAtTime(o.lp2, t0 + dur);
      node.connect(f); node = f;
    }
    node.connect(g); g.connect(bus);
    osc.start(t0); osc.stop(t0 + dur + .05);
  }

  /* filtered noise burst — the transient that makes a tap feel like contact */
  function noise(o){
    if(!live()) return;
    const t0 = ctx.currentTime + (o.delay || 0);
    const dur = o.dur ?? .05;
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = o.type || 'bandpass'; f.frequency.value = o.f || 1600; f.Q.value = o.q ?? 1.1;
    const g = ctx.createGain(); g.gain.value = o.gain ?? .06;
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t0);
  }

  /* C major pentatonic, four octaves — combos walk up it */
  const SCALE = [523.25,587.33,659.25,783.99,880.00,1046.50,1174.66,1318.51,1567.98,1760.00,2093.00];

  return {
    resume, boot,
    /* for debugging from the console: Audio.state */
    get state(){ return ctx ? ctx.state : 'not started'; },
    pickup(){
      noise({f:2400,q:1.6,gain:.045,dur:.03});
      voice({f:520,f2:640,dur:.05,gain:.05,type:'sine'});
    },
    place(sizeHint=1){
      const base = 200 - Math.min(sizeHint,5)*11;
      noise({f:900,q:.7,gain:.05,dur:.035,type:'lowpass'});
      voice({f:base*2.6,f2:base*1.7,dur:.085,gain:.11,type:'triangle',lp:2600,lp2:900});
      voice({f:base,f2:base*.78,dur:.11,gain:.07,type:'sine'});
    },
    invalid(){
      voice({f:150,f2:110,dur:.1,gain:.06,type:'sine',lp:700});
    },
    clear(lines, combo){
      const step = clamp(combo-1, 0, 6);
      const root = SCALE[clamp(step + (lines-1), 0, SCALE.length-1)];
      voice({f:root, dur:.34, gain:.16, type:'sine', atk:.004});
      voice({f:root*1.5, dur:.28, gain:.085, type:'sine', delay:.012});
      if(lines >= 2){
        voice({f:root*2, dur:.4, gain:.10, type:'sine', delay:.04});
        noise({f:5200,q:.9,gain:.035,dur:.12});
      }
      if(lines >= 3){
        voice({f:root*2.5, dur:.5, gain:.09, type:'sine', delay:.085});
        voice({f:root*3,   dur:.55, gain:.06, type:'sine', delay:.13});
      }
    },
    combo(n){
      if(n < 2) return;
      const f = SCALE[clamp(n-2,0,SCALE.length-1)] * 1.5;
      voice({f:f*.75, f2:f, dur:.16, gain:.08, type:'triangle', atk:.01});
    },
    best(){
      [0,1,2,4].forEach((s,i)=> voice({f:SCALE[s]*1.5, dur:.5, gain:.11, type:'sine', delay:i*.075}));
      noise({f:6000,q:.6,gain:.03,dur:.3,delay:.05});
    },
    over(){
      [0,-2,-5].forEach((s,i)=>
        voice({f:440*Math.pow(2,s/12), dur:.5, gain:.1, type:'sine', delay:i*.13, lp:1800}));
    }
  };
})();

/* ---------- haptics ---------- */
function haptic(pattern){
  if(!settings.haptics) return;
  if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
}
const HAPTIC = {
  pickup: 7,
  place:  11,
  invalid:[0,9,40,9],
  clear1: 16,
  clear2: [0,18,26,22],
  clear3: [0,22,24,26,24,32],
  best:   [0,26,40,26,40,52],

/* ============================================================
   Board maths — 8 rows, one byte each. Bit c of row r = filled.
   Fast enough that the piece generator can simulate thousands of
   futures between turns without dropping a frame.
   ============================================================ */
const N = 8;
const FULL_ROW = 0xFF;

const newBoard = ()=> new Int32Array(N);
const popcount = v=>{ v=v-((v>>1)&0x55555555); v=(v&0x33333333)+((v>>2)&0x33333333); return ((v+(v>>4)&0x0F0F0F0F)*0x01010101)>>24; };

function canPlace(bb, piece, r, c){
  if(r < 0 || c < 0 || r + piece.h > N || c + piece.w > N) return false;
  const rows = piece.rows;
  for(let i=0;i<rows.length;i++){
    const m = rows[i];
    if(m && (bb[r+i] & (m << c))) return false;
  }
  return true;
}
function anyPlacement(bb, piece){
  const maxR = N - piece.h, maxC = N - piece.w;
  for(let r=0;r<=maxR;r++) for(let c=0;c<=maxC;c++) if(canPlace(bb,piece,r,c)) return true;
  return false;
}
function stamp(bb, piece, r, c){
  const rows = piece.rows;
  for(let i=0;i<rows.length;i++) if(rows[i]) bb[r+i] |= rows[i] << c;
}
/* which rows / columns are complete right now */
function findLines(bb, outRows, outCols){
  outRows.length = 0; outCols.length = 0;
  let and = FULL_ROW;
  for(let r=0;r<N;r++){
    if(bb[r] === FULL_ROW) outRows.push(r);
    and &= bb[r];
  }
  and &= FULL_ROW;
  for(let c=0;c<N && and;c++) if(and >> c & 1) outCols.push(c);
}
function wipeLines(bb, rows, cols){
  for(let i=0;i<rows.length;i++) bb[rows[i]] = 0;
  for(let i=0;i<cols.length;i++){
    const m = ~(1 << cols[i]);
    for(let r=0;r<N;r++) bb[r] &= m;
  }
}

  return { id, idx, cells, rows, w, h, n: cells.length, tier, weight };
